<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />

    <title>Offline — Ops</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #64748b; font-size: 14px; margin: 0 0 20px; }

        display: inline-block;
        min-height: 44px;
        line-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        font-size: 15px;
      }
    </style>

  <body>
    <main>
      <h1>Tidak ada koneksi</h1>
      <p>Draft laporanmu tersimpan di perangkat ini dan akan kembali saat kamu membuka aplikasi.</p>
