# managed-by-ops: isolated virtual host; do not replace any existing server block.
log_format ops_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 10.0.3.25:80;
    server_name ops.provaliantgroup.com;
    access_log /var/log/nginx/ops.access.log ops_safe;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ops-acme; }
    location / { return 308 https://ops.provaliantgroup.com$request_uri; }
}
server {
    listen 10.0.3.25:443 ssl http2;
    server_name ops.provaliantgroup.com;
    ssl_certificate /etc/letsencrypt/live/ops.provaliantgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.provaliantgroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ops.access.log ops_safe;
    error_log /var/log/nginx/ops.error.log warn;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:4215;
        # Guard browser redirects against any future internal-listener leak.
        proxy_redirect ~^https?://(localhost|127\.0\.0\.1):4215(/.*)$ https://ops.provaliantgroup.com$2;
        proxy_http_version 1.1;
        proxy_set_header Host ops.provaliantgroup.com;
        proxy_set_header X-Forwarded-Host ops.provaliantgroup.com;
        proxy_set_header X-Ops-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
